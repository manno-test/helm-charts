replicaCount: 1

image:
  repository: redis
  pullPolicy: IfNotPresent
  tag: "7.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 6379

ingress:
  enabled: false

resources: {}

livenessProbe:
  tcpSocket:
    port: 6379
readinessProbe:
  tcpSocket:
    port: 6379

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
