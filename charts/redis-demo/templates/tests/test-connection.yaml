apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "redis-demo.fullname" . }}-test-connection"
  labels:
    {{- include "redis-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: redis:7-alpine
      command: ['sh', '-c']
      args: ['redis-cli -h {{ include "redis-demo.fullname" . }} ping | grep -q PONG']
  restartPolicy: Never
